# Nixpacks utilise l'archive nixpkgs épinglée ci-dessous pour garantir des
# versions corrigées et reproductibles :
#   - PHP 8.3.36   (php2shell, CVE-2026-109618 / CVE-2026-109619)
#   - Node 22.23.4 (Brotli, CVE-2026-111497)
#
# Node 24.22.1 n'est pas encore disponible dans la même archive nixpkgs.
# NIXPACKS_NODE_VERSION=22 (voir [variables]) force la branche 22.23.4.
# Sans cela, package.json/engines force nodejs_24 et le garde-fou Node refuse
# 24.21.0, qui est vulnérable.
#
# Les garde-fous de la phase "install" font échouer le build si les versions
# fournies sont vulnérables :
#   - php2shell : CVE-2026-109618 / CVE-2026-109619
#   - Brotli    : CVE-2026-111497 (Node.js)
#
# Pour un contrôle exact avec Node 24.22.1, basculer le build pack Coolify sur
# "Dockerfile" (php:8.3.36-fpm-alpine et node:24.22.1-alpine).

[phases.setup]
# Archive nixpkgs du 21/10/2026 : PHP 8.3.36 + Node 22.23.4 corrigés.
nixpkgsArchive = "c53532a938651ed45ebef072c8da6e74256e7072"

[phases.install]
dependsOn = ["setup"]
cmds = [
    # Garde-fou php2shell : logique par branche (8.2.35 / 8.3.36 / 8.4.27 /
    # 8.5.12). Un simple ">= 8.3.36" laisserait passer 8.4.0 à 8.4.26.
    "bash scripts/php2shell-check.sh --no-containers",
    # Garde-fou Node.js Brotli : CVE-2026-111497, corrigé en 22.23.4 /
    # 24.22.1 / 26.12.1. Échoue aussi sur les branches EOL (20, 23, 25).
    "bash scripts/node-brotli-check.sh",
    # L'ajout de "-vvv" est CRUCIAL ici pour afficher les logs détaillés de l'erreur
    "composer install --no-dev --optimize-autoloader -vvv",
    "npm ci"
]

[variables]
# Force Node 22.23.4, seule version corrigée disponible dans l'archive
# nixpkgs épinglée ci-dessus (Node 24 y est 24.21.0, vulnérable).
NIXPACKS_NODE_VERSION = "22"
NODE_OPTIONS = "--dns-result-order=ipv4first"
# On enlève la limite de mémoire de Composer pour éviter les crashs silencieux
COMPOSER_MEMORY_LIMIT = "-1"

[start]
cmd = "bash start.sh"