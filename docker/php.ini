upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 1024M
max_execution_time = 600
max_input_time = 600
default_charset = "UTF-8"
log_errors = On
error_log = /dev/stderr

; --- Durcissement php2shell : CVE-2026-109618 / CVE-2026-109619 ---
; Coupe le chemin "session upload progress", confirmé pour CVE-2026-109619.
; Laravel n'utilise pas cette fonctionnalité.
session.upload_progress.enabled = 0
; Coupe le chemin "fatal error backtrace" de CVE-2026-109619.
; Directive propre à PHP 8.5, ignorée sans erreur sur les branches antérieures.
fatal_error_backtraces = 0